[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Block seed-data from public
[[redirects]]
  from   = "/seed-data.html"
  to     = "/"
  status = 301
  force  = true

# Redirect www → apex
[[redirects]]
  from = "https://www.scvanavil.ch/*"
  to   = "https://scvanavil.ch/:splat"
  status = 301
  force  = true
